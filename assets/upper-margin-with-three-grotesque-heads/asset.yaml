# descriptive: find it and understand it
id: upper-margin-with-three-grotesque-heads
title: Top-margin bar with a crawling hybrid and three heads
description: A long horizontal bar from the top margin. At the left it ends in a blue angular foliate knot with orange-tipped lobes and a gold disc; the bar runs right as a blue band with a white line, a pink band with white dots and a thin gold rule, then thins into a plain rod. On the right half a blue four-legged hybrid with a human head crawls to the right, a small bald grotesque head sits on the rod, and the bar ends in a larger head in a white hood. Black contours; the background is transparent.
