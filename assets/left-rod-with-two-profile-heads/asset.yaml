# descriptive: find it and understand it
id: left-rod-with-two-profile-heads
title: Left-margin rod with two profile heads
description: A tall vertical bar from the left margin. The upper half is a blue band with a row of white rings beside a pink band with a white wavy line; at mid-height a gold disc sits on the left edge where the bar narrows into a thin blue rod with a white zigzag. A bald head in profile faces right at the top, and the rod curves right at the bottom into a second profile head with a white cap band and a red cheek, also facing right. Black contours; the background is transparent.
