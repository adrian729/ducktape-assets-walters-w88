title: Seated harper in a gold tunic
description: A man in a gold tunic and a white cap sits in profile facing right on a blue box-like bench and plays a tall triangular harp with an orange-red frame and white strings, one hand raised to the top of the frame, the other plucking the strings. Brown hose, one foot hanging below the seat, black contours; the background is transparent.
