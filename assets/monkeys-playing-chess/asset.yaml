id: monkeys-playing-chess
title: Two monkeys playing chess
description: Two tan monkeys with hatched fur sit facing each other on either side of an upright gold chequered board painted on a black ground between them. The left monkey holds up a small gold chess piece in one hand; the right monkey rests a hand on the board. Both sit with bent legs and splayed feet, in heavy black contours; the background is transparent.
