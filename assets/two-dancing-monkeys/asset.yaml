id: two-dancing-monkeys
title: Two monkeys dancing hand in hand
description: Two cream monkeys dance leaning away from each other, joined by their clasped inner hands at the centre, each raising the outer arm with a closed fist. The left monkey has hatched fur and faces right; the right one is smooth and faces left; both stand on bent legs with splayed feet. Black contours with light tan shading; the background is transparent.
