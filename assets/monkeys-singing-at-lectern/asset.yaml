id: monkeys-singing-at-lectern
title: Two monkeys singing at a lectern
description: Two cream monkeys with hatched fur stand upright one behind the other at the left, mouths open in song, facing right towards a tall brown lectern. The front monkey stretches an arm to the open book on the slanted desk, whose pages show ruled lines of text; the lectern stands on a tall ochre-brown foot. Black contours; the background is transparent.
