id: right-black-leaf-curl-on-blue-and-gold-stem
title: Black leaf scroll rising from a painted stem
description: A painted stem of pink, blue and gold stripes runs diagonally from the lower left and ends in a blue and pink angular node, from which a thin black ink line climbs upward with small solid leaf blobs, loops once halfway up and ends in a hooked tip at the top. Black contours; the background is transparent.
