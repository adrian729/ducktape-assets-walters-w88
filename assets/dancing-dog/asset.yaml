title: Dog dancing on its hind legs
description: A pale grey-green dog rears up on its hind legs facing left, forelegs raised and bent in front of its chest, mouth open and ears back, its long tail curving out to the right and ending in a hooked tip. Heavy black contours with grey-blue shading on a cream-grey body; the background is transparent.
