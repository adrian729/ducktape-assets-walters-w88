# descriptive: find it and understand it
id: corner-rod-with-hooded-head
title: Corner rod with a hooded head at the top
description: An L-shaped piece of bar border. A thin tan and gold rod with a pink inner band and white dots rises from a lower-left knot and carries at its top a human head in a pale green hood, the face turned to the right. At the foot the rod meets a pink and blue angular knot with a white curl and a gold boss, from which a short horizontal bar of blue, white and gold runs to the right and ends in a gold leaf tip. Black contours; the background is transparent.
