# descriptive: find it and understand it
id: lower-profile-head-on-long-blue-and-gold-rod
title: Long margin rod ending in a hooded profile head
description: A tall vertical bar. For two thirds of its height it is a wide band of gold, pink with a white wavy line, and blue with white edges, cut flat at the top. It then narrows through a blue and pink angular leaf knot with a white lobe into a thin blue rod that curves to the left at the bottom and ends in a human head in profile with a white hood, facing left. Black contours; the background is transparent.
