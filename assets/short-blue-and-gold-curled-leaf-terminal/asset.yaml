# descriptive: find it and understand it
id: short-blue-and-gold-curled-leaf-terminal
title: Short striped bar end curling down
description: A short horizontal segment of bar border running to the right and curling down at its right end. It is built of parallel stripes of gold, brown, blue and white inside a black contour, the gold leaf flaking in places; the left end is cut flat where it left the bar, showing blue and white. The background is transparent.
