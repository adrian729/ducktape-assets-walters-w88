id: woman-leading-harrow-horse
title: Woman driving a horse that drags a harrow
description: A woman in an orange-red robe and white wimple walks at the right, facing left, and raises a long green switch over a cream horse that walks left in front of her. The horse wears a dark collar and harness lines that run back to a green triangular harrow with dark teeth, dragged along the ground at the far left by a short shaft. Black contours; the background is transparent.
