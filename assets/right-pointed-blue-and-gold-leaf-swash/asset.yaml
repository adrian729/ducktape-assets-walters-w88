id: right-pointed-blue-and-gold-leaf-swash
title: Pointed blue and gold leaf swash
description: A blue foliate swash rising from the lower left to the upper right, shaped like an angular leaf with a spiky pointed lobe at its right end. A gold stroke runs along its length, white lines and small white marks pick out the inner edges, and a thin black contour surrounds it. The left end is cut flat where it joined the decorated letter; the background is transparent.
