# descriptive: find it and understand it
id: lower-black-foliate-curl
title: Black pen-flourish with a leaf cluster
description: A black ink flourish from the lower margin, a thin line sweeps down from the upper left, curves along the bottom and runs out to the right, carrying a cluster of small solid leaves at its centre and a knobbed terminal at the right end. The ink is grainy and slightly broken, as in the source. Black only; the background is transparent.
